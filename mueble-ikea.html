<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosa rara de IKEA</title>
<style>
  :root { --bg:#f5f5f5; --fg:#111; --btn:#0058a3; --btn-fg:#fff; --link:#0058a3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#f2f2f2; --btn:#ffdb00; --btn-fg:#111; --link:#ffdb00; }
  }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:1.5rem; background:var(--bg); color:var(--fg);
         font-family:system-ui,sans-serif; text-align:center; padding:1rem; }
  button { font-size:1.2rem; padding:.8rem 1.8rem; border:0; border-radius:999px; cursor:pointer;
           background:var(--btn); color:var(--btn-fg); font-weight:700; }
  button:active { transform:scale(.97); }
  #nombre { font-size:2.4rem; font-weight:800; letter-spacing:.05em; min-height:3rem; }
  #enlace a { color:var(--link); word-break:break-all; }
</style>
</head>
<body>
  <button id="btn">Dame algo de IKEA</button>
  <div id="nombre"></div>
  <div id="enlace"></div>

<script>
  const nombres = [
    // Muebles
    "FJÄLLBO","GRÖNLID","KNARREVIK","TJUSIG","SKUBB","FLISAT","SMÅSTAD","TROFAST",
    "FRIHETEN","BEKVÄM","SÖDERHAMN","KLIPPAN","VITTSJÖ","SKRUVSTA","TÄRNABY","LIDHULT",
    "SUNDVIK","FLÄRKE","SLÄKT","URSKOG","STUVA","BRIMNES","KIVIK","POÄNG","FÖRHÖJA",
    "HEMNES","KALLAX","EKTORP","BESTÅ","PLATSA","NORDLI","SANDSBERG","STOCKHOLM","GURLI",
    "PAX","IVAR","RÅSKOG","SKÅDIS","MAMMUT","DUKTIG","LILLABO",
    // Decoración, textil, hogar, peluches
    "BLÅHAJ","FRAKTA","TERTIAL","LOHALS","HEKTAR","FADO","SMYCKA","KNODD","DRÖNA",
    // Cocina y mesa
    "FÄRGKLAR","POKAL","OFTAST","VARDAGEN",
    // Comida
    "KÖTTBULLAR","SYLT LINGON","GLÖGG","PRINSESSTÅRTA","DRÖMTÅRTA","GRAVAD LAX","DAIM","RÄKSMÖRGÅS"
  ];
  let ultimo = "";
  document.getElementById("btn").addEventListener("click", () => {
    let n;
    do { n = nombres[Math.floor(Math.random() * nombres.length)]; } while (n === ultimo);
    ultimo = n;
    const url = "https://www.ikea.com/es/es/search/?q=" + encodeURIComponent(n);
    document.getElementById("nombre").textContent = n;
    const c = document.getElementById("enlace");
    c.innerHTML = "";
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = url;
    c.appendChild(a);
  });
</script>
</body>
</html>
